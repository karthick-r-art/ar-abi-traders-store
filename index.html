<script>
  document.getElementById('yr').textContent=new Date().getFullYear();
  // hero tiles = top 4 populated categories
  (function(){
    const counts={}; (window.PRODUCTS||[]).forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
    const top=Object.entries(counts).filter(([c])=>window.CATMETA[c]).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const tints=["#0E5A3C","#F2A900","#C4361F","#3E8E6B"];
    const txt=["#F6EFDD","#20301f","#fff","#fff"];
    document.getElementById('heroTiles').innerHTML=top.map(([c,n],i)=>{
      const m=window.CATMETA[c];
      return `<button class="tile" data-cat="${c}" style="background:${tints[i]};color:${txt[i]}">
        <span class="big">${m.em}</span><div><b>${c}</b><br><small>${n} items</small></div></button>`;
    }).join("");
    document.querySelectorAll('#heroTiles .tile').forEach(el=>el.onclick=()=>{
      const ev=el.dataset.cat; const btn=document.querySelector(`#rail [data-cat="${ev}"]`); if(btn) btn.click();
    });
  })();
</script>
