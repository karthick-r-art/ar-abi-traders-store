# Netlify config — A.R. Abi Traders storefront (static)
[build]
  publish = "."


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short URLs (pamphlets) — keep in sync with vercel.json
[[redirects]]
  from = "/rice"
  to = "/category/rice-atta/"
  status = 301

